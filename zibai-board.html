<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>茲白虛擬棚 · 留言板原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2622; --paper:#eef1e8; --paper2:#e2e7db; --line:#c9d0c2;
  --red:#e8433a; --yellow:#f3b833; --green:#33b870;
  --amber:#e9a23b; --emerald:#19a078; --tape:#f08a24;
  --ui:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#242c2a;overflow:hidden;font-family:var(--ui);color:var(--ink)}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 控台膠帶風格的標籤 */
.tape{background:var(--paper);color:var(--ink);border-radius:3px;padding:6px 11px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 10px rgba(0,0,0,.35);font-family:var(--hand);font-weight:700}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#brand{transform:rotate(-1.2deg);font-size:19px;line-height:1.1}
#brand small{display:block;font-size:12px;font-weight:400;opacity:.7;margin-top:2px}
#who{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#bind{font-size:13px;display:flex;align-items:center;gap:6px;transform:rotate(.8deg)}
#bind i{width:8px;height:8px;border-radius:50%;background:#06c755;display:inline-block}
#roleBtn{border:0;font-size:12px;background:rgba(238,241,232,.18);color:var(--paper);border-radius:999px;padding:5px 10px;backdrop-filter:blur(6px)}
#roleBtn[aria-pressed=true]{background:var(--amber);color:var(--ink)}

#filters{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:6px;z-index:5}
.chip{border:0;display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px 6px 8px;border-radius:999px;background:rgba(20,26,24,.62);color:var(--paper);backdrop-filter:blur(6px)}
.chip[aria-pressed=false]{opacity:.45}
.chip .ico{width:14px;height:14px;display:inline-block}
.ico.dot{border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--amber) 45%,transparent 72%)}
.ico.note{background:#ffe27a;transform:rotate(-6deg);border-radius:1px}
.ico.slate{background:repeating-linear-gradient(135deg,#fff 0 3px,#222 3px 6px);border-radius:1px}
.chip b{font-weight:400;opacity:.75}
.chip .red{color:#ff8e86}

#dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;z-index:5;pointer-events:none}
#dock>*{pointer-events:auto}
#shots{display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 110px)}
#shots button{border:0;background:rgba(20,26,24,.62);color:var(--paper);padding:8px 12px;border-radius:8px;font-size:14px;backdrop-filter:blur(6px)}
#shots button[aria-current=true]{background:var(--paper);color:var(--ink)}
#postBtn{border:0;width:78px;height:78px;border-radius:50%;background:var(--emerald);color:#fff;font-size:17px;
  box-shadow:0 0 0 5px rgba(25,160,120,.25),0 8px 22px rgba(0,0,0,.4)}

#caption{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);max-width:min(88vw,460px);
  text-align:center;font-family:var(--hand);font-size:17px;color:var(--paper);text-shadow:0 2px 8px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;pointer-events:none;z-index:4}
#caption.on{opacity:1}

/* 走近才出現的短文字 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform-origin:0 100%;max-width:190px;padding:5px 9px;border-radius:10px 10px 10px 2px;
  background:rgba(238,241,232,.92);font-family:var(--hand);font-size:14px;line-height:1.35;pointer-events:auto;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .25s;will-change:transform}
.lb b{display:block;font-family:var(--ui);font-weight:400;font-size:11px;opacity:.6}
.lb i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}

/* 討論串面板：像一張棚內記錄單 */
#panel{position:fixed;z-index:10;background:var(--paper);display:flex;flex-direction:column;
  right:0;top:0;bottom:0;width:min(420px,100vw);transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  box-shadow:-10px 0 30px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.open{transform:none}
@media (max-width:640px){
  #panel{top:auto;left:0;width:100%;height:74vh;border-radius:16px 16px 0 0;transform:translateY(105%)}
  #panel.open{transform:none}
  #filters{top:calc(env(safe-area-inset-top,0px) + 64px)}
}
#panel header{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px dashed var(--line)}
#panel .kind{font-size:17px}
#panel .close{margin-left:auto;border:0;background:var(--paper2);width:34px;height:34px;border-radius:50%;font-size:18px}
.tally{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px 3px 7px;border-radius:999px;background:var(--paper2)}
.tally::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tally.red{--c:var(--red)}.tally.yellow{--c:var(--yellow)}.tally.green{--c:var(--green)}
#thread{flex:1;overflow-y:auto;padding:14px 16px 8px}
.msg{margin:0 0 14px;max-width:92%}
.msg .meta{font-size:12px;opacity:.6;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.msg .body{font-family:var(--hand);font-size:17px;line-height:1.55;padding:9px 12px;border-radius:4px 12px 12px 12px;background:#fff}
.msg.origin .body{font-size:19px;background:transparent;padding:0 0 10px;border-bottom:1px dashed var(--line);border-radius:0}
.msg.zibai .body{background:#fbefd9;border-left:3px solid var(--amber)}
.msg.teacher .body{background:#dff0e8;border-left:3px solid var(--emerald)}
.msg.me{margin-left:auto}.msg.me .body{background:#e3e9f7;border-radius:12px 4px 12px 12px}
.msg.system{max-width:100%;text-align:center;font-size:12px;opacity:.65}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;color:#fff;background:#7c8a84}
.av.z{background:var(--amber)}.av.t{background:var(--emerald)}
.vis{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--paper2)}
#panelFoot{padding:10px 16px 14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.row textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:10px;padding:10px;font:16px var(--hand);background:#fff}
.btn{border:0;border-radius:10px;padding:0 14px;min-height:44px;background:var(--ink);color:var(--paper);font-size:15px}
.btn.alt{background:var(--green);color:#fff}
.btn.amber{background:var(--amber);color:var(--ink)}
.hint{font-size:12px;opacity:.6;margin:0}

/* 發文 */
#compose{position:fixed;inset:0;z-index:12;display:none;align-items:flex-end;justify-content:center;background:rgba(10,14,12,.45)}
#compose.open{display:flex}
#sheet{background:var(--paper);width:min(520px,100vw);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
#sheet h2{margin:0 0 12px;font-size:20px;font-weight:400}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.types button{border:2px solid transparent;background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.types button[aria-checked=true]{border-color:var(--ink)}
.types .ico{width:22px;height:22px}
.moods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.moods button{border:0;border-radius:999px;padding:5px 11px 5px 7px;background:#fff;font-size:14px;display:flex;gap:6px;align-items:center}
.moods button::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.moods button[aria-checked=true]{background:var(--ink);color:var(--paper)}
#txt{width:100%;height:92px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:18px/1.5 var(--hand);background:#fff}
.count{text-align:right;font-size:12px;opacity:.55;margin:2px 0 8px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg{display:flex;background:#fff;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px}
.seg button[aria-checked=true]{background:var(--paper2)}
.consent{font-size:12px;opacity:.65;margin:0 0 12px;line-height:1.5}
.sheetBtns{display:flex;gap:8px}.sheetBtns .btn{flex:1}
.sheetBtns .ghost{background:var(--paper2);color:var(--ink);flex:0 0 90px}

#splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(36,44,42,.55),rgba(14,18,16,.92));transition:opacity .7s}
#splash.gone{opacity:0;pointer-events:none}
#card{background:var(--paper);width:min(360px,86vw);padding:22px 22px 18px;border-radius:6px;transform:rotate(-.6deg);box-shadow:0 18px 50px rgba(0,0,0,.5)}
#card h1{margin:0 0 4px;font-weight:400;font-size:26px}
#card .sub{margin:0 0 14px;font-size:13px;opacity:.6}
#card p{font-family:var(--hand);font-size:16px;line-height:1.6;margin:0 0 10px}
#card .fine{font-family:var(--ui);font-size:12px;opacity:.6}
#enter{width:100%;margin-top:8px;background:var(--emerald);color:#fff}
#loadState{font-size:12px;opacity:.68;margin-top:8px;text-align:center;min-height:18px}
#loadProgress{height:4px;margin-top:8px;border-radius:999px;background:rgba(31,42,38,.10);overflow:hidden;opacity:0;transition:opacity .25s}
#loadProgress.on{opacity:1}
#loadProgress i{display:block;width:0;height:100%;border-radius:inherit;background:var(--emerald);transition:width .18s ease}

/* 茲白說話泡泡 */
#bubble{position:fixed;left:0;top:0;z-index:4;max-width:220px;padding:8px 12px;border-radius:14px 14px 14px 3px;background:#fbefd9;
  border:2px solid var(--amber);font-family:var(--hand);font-size:16px;line-height:1.45;color:var(--ink);pointer-events:none;
  opacity:0;transition:opacity .25s;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#bubble.on{opacity:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-200%);visibility:hidden;z-index:30;transition:transform .35s,visibility .35s}
#toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
  "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
  "@pixiv/three-vrm-animation":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.5/lib/three-vrm-animation.module.min.js"
}}
</script>

<body>
<canvas id="stage"></canvas>
<div id="labels"></div>

<div id="hud">
  <div id="brand" class="tape">茲白虛擬棚<small>SYB201 大綠棚 · 留言板</small></div>
  <div id="who">
    <div id="bind" class="tape"><i></i>LINE 已綁定 · <span id="meName"></span></div>
    <button id="roleBtn" aria-pressed="false">切到老師視角</button>
  </div>
</div>

<div id="filters">
  <button class="chip" data-f="mood" aria-pressed="true"><span class="ico dot"></span>心情光點 <b id="cMood"></b></button>
  <button class="chip" data-f="learn" aria-pressed="true"><span class="ico note"></span>學習便利貼 <b id="cLearn"></b></button>
  <button class="chip" data-f="question" aria-pressed="true"><span class="ico slate"></span>問題場記板 <b id="cQ"></b></button>
</div>

<div id="caption"></div>

<div id="dock">
  <div id="shots">
    <button data-shot="wide" aria-current="true">全景</button>
    <button data-shot="zibai">茲白</button>
    <button data-shot="wall">學習牆</button>
    <button data-shot="slates">場記區</button>
  </div>
  <button id="postBtn">留言</button>
</div>

<aside id="panel" aria-hidden="true">
  <header><span class="kind" id="pKind"></span><span id="pTally"></span><button class="close" id="pClose" aria-label="關閉">×</button></header>
  <div id="thread"></div>
  <div id="panelFoot"></div>
</aside>

<div id="compose">
  <div id="sheet" role="dialog" aria-label="留言">
    <h2>在棚裡留下點什麼</h2>
    <div class="types" role="radiogroup">
      <button data-t="mood" role="radio" aria-checked="true"><span class="ico dot"></span>心情光點</button>
      <button data-t="learn" role="radio" aria-checked="false"><span class="ico note"></span>學到什麼</button>
      <button data-t="question" role="radio" aria-checked="false"><span class="ico slate"></span>問個問題</button>
    </div>
    <div class="moods" id="moodPick" role="radiogroup"></div>
    <textarea id="txt" maxlength="40" placeholder="今天的心情是…"></textarea>
    <div class="count" id="count">0 / 40</div>
    <div class="toggles">
      <div class="seg" id="segName" role="radiogroup"><button role="radio" aria-checked="true" data-v="nick"></button><button role="radio" aria-checked="false" data-v="anon">匿名</button></div>
      <div class="seg" id="segVis" role="radiogroup"><button role="radio" aria-checked="true" data-v="public">大家看得到</button><button role="radio" aria-checked="false" data-v="teacher">只給老師看</button></div>
    </div>
    <p class="consent">留言會依你在茲白那邊的研究同意設定處理，隨時可以跟茲白說要退出。</p>
    <div class="sheetBtns"><button class="btn ghost" id="cancel">取消</button><button class="btn" id="submit">放出光點</button></div>
  </div>
</div>

<div id="splash">
  <div id="card">
    <h1>茲白虛擬棚</h1>
    <p class="sub">SYB201 大綠棚的線上分身</p>
    <p>嗨，我是茲白！這裡可以留心情、貼今天學到的東西，也可以把問題立成場記板給我跟阿祥老師看。</p>
    <p class="fine">第一次進棚會把這個 LINE 帳號綁到你的社員身分，老師回覆你的問題時，我才能在 LINE 通知你。</p>
    <button class="btn" id="enter" disabled>正在搭棚…</button>
    <div id="loadState">載入攝影棚</div>
    <div id="loadProgress" aria-hidden="true"><i></i></div>
  </div>
</div>
<div id="toast" class="tape"></div>
<div id="bubble"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {VRMLoaderPlugin, VRMUtils} from '@pixiv/three-vrm';
import {VRMAnimationLoaderPlugin} from '@pixiv/three-vrm-animation';
import {createActor} from './zibai-actor.js';
import {loadBehavior, migrate, STORE_KEY, BUS_NAME, motionsDB, layoutFor, makeLayout, slateSpot, WALL_SIZE} from './zibai-behavior.js';
import {listScenes, loadScenePack} from './scene-host.js';

/* ───────── 設定 ───────── */
const qs = new URLSearchParams(location.search);
const STAGE = new THREE.Vector3(0, 0, -4.8);           // 茲白的家，載入場景後依互動配置更新
const DIRECTOR = qs.has('director');                   // 導演台開的預覽視窗
const ME = {nick: '綠幕小羊'};                        // 之後由 LIFF profile + 綁定結果帶入
const MOODS = {
  happy:{name:'開心',hex:'#ffc94a'}, hype:{name:'興奮',hex:'#ff7fa3'}, calm:{name:'平靜',hex:'#63d9c4'},
  tired:{name:'好累',hex:'#7d9cff'}, stuck:{name:'卡關',hex:'#ff8b3d'}, nervous:{name:'緊張',hex:'#b58cff'},
};
const STATUS = {red:'等老師', yellow:'已回覆', green:'已解決'};
const TALLY_HEX = {red:0xff3a2e, yellow:0xffb81f, green:0x2ee07a};
const LIMIT = {mood:40, learn:60, question:120};

/* ───────── 假資料（之後換成 API） ───────── */
let seq = 0;
let qseq = 0;
const it = (o) => ({id:'m'+(++seq), anon:false, vis:'public', thread:[], ...o, ...(o.type === 'question' ? {qn:++qseq} : {})});
const qLabel = (d) => 'Q-' + String(d.qn).padStart(2, '0');
const DATA = [
  it({type:'mood', mood:'happy', nick:'綠幕小羊', mine:true, text:'第一次把 V皮丟進 Pocket VP 就動起來了！', t:'9/19 21:40'}),
  it({type:'mood', mood:'tired', anon:true, text:'剪片剪到三點，社課會準時出現', t:'9/19 03:12'}),
  it({type:'mood', mood:'calm', nick:'豆腐', text:'下雨天在社辦聽大家吵燈光', t:'9/18 16:05'}),
  it({type:'mood', mood:'stuck', anon:true, text:'LiveLink 一直連不上，心好累', t:'9/18 23:30'}),
  it({type:'mood', mood:'hype', nick:'Mika', text:'下週要進大綠棚拍了！！', t:'9/18 12:10'}),
  it({type:'mood', mood:'nervous', anon:true, vis:'teacher', text:'期中發表要站在綠幕前講話，有點怕', t:'9/17 22:48'}),
  it({type:'mood', mood:'happy', nick:'阿哲', text:'搖臂推起來超順', t:'9/17 15:20'}),
  it({type:'mood', mood:'calm', anon:true, text:'今天只是想來看看茲白', t:'9/17 11:02'}),
  it({type:'mood', mood:'tired', nick:'小瑜', text:'三堂課連上，腦袋空空', t:'9/16 17:45'}),
  it({type:'mood', mood:'hype', anon:true, text:'Orbiter 打起來好美', t:'9/16 14:33'}),
  it({type:'mood', mood:'happy', nick:'Amy', text:'茲白今天有認出我', t:'9/16 10:08'}),
  it({type:'mood', mood:'calm', nick:'阿哲', text:'把線材收好的感覺很療癒', t:'9/15 20:14'}),

  it({type:'learn', nick:'阿哲', text:'人離綠幕拉開兩公尺以上，溢色少很多', t:'9/19 18:02', paper:'#ffe27a'}),
  it({type:'learn', anon:true, text:'Exposure 先固定再調燈，不然越調越亂', t:'9/19 13:40', paper:'#ffb3c7'}),
  it({type:'learn', nick:'小瑜', text:'VRM 進場景前先確認是 A-pose 還是 T-pose', t:'9/18 21:22', paper:'#b8ecd9'}),
  it({type:'learn', nick:'Mika', text:'SkyPanel 可以直接調色溫，不用貼色紙', t:'9/18 15:11', paper:'#c7d6ff'}),
  it({type:'learn', anon:true, text:'Tally 紅燈那台是正在播的，看鏡頭要看紅燈', t:'9/17 19:50', paper:'#ffe27a'}),

    if (ctx.measureText(line + ch).width > maxW && line){ lines.push(line); line = ch; } else line += ch;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines){ lines.length = maxLines; lines[maxLines-1] = lines[maxLines-1].slice(0, -1) + '…'; }
  return lines;
}

async function loadSceneLayer(wanted){
  const list = await listScenes();
  const entry = list.find(x => x.id === wanted) || list[0];
  if (!entry) throw Error('scenes/ 資料夾裡沒有場景包');
  const pack = await loadScenePack(entry.path);
  if (scenePack){ scene.remove(scenePack.inst.root); scenePack.dispose(); }
  scenePack = pack; studio = pack.inst; sceneId = pack.manifest.id || entry.id;
  studio.root.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
  scene.add(studio.root);
  const m = pack.manifest;
  scene.background = new THREE.Color(m.background || '#242c2a');
  scene.fog = new THREE.FogExp2(m.fogColor || m.background || '#29352f', 0.012);
  const b = pack.meta.bounds;
  sceneBounds = b ? {minX:b.min[0], maxX:b.max[0], minZ:b.min[2], maxZ:b.max[2], maxY:b.max[1]} : {minX:-12, maxX:12, minZ:-12, maxZ:12, maxY:9};
  clampBox.min.set(sceneBounds.minX + .6, .3, sceneBounds.minZ + .6);
  clampBox.max.set(sceneBounds.maxX - .6, Math.max(2.5, sceneBounds.maxY - 1.2), sceneBounds.maxZ - .6);
  if (!behavior.layouts?.[sceneId]){                     // 新場景：以場景宣告的表演區為中心，給一份預設互動配置
    layoutFor(behavior, sceneId, pack.meta.actorArea?.center);

}

async function loadVRM(src, onProgress = null){
  const loader = new GLTFLoader(); loader.register(p => new VRMLoaderPlugin(p));
  console.info('[Zibai] VRM loading:', src);
  try{
    const gltf = await loader.loadAsync(src, (ev) => {
      const total = Number(ev.total) || 0, loaded = Number(ev.loaded) || 0;
      const ratio = total > 0 ? Math.min(1, loaded / total) : null;
      onProgress?.({phase: ratio === 1 ? 'parse' : 'download', loaded, total, ratio});
    });
    onProgress?.({phase:'prepare', loaded:1, total:1, ratio:1});
    if (vrm){ zibaiRoot.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.combineSkeletons?.(gltf.scene);
    VRMUtils.rotateVRM0(vrm);
    vrm.scene.traverse(o => { if (o.isMesh){ o.castShadow = true; o.frustumCulled = false; } });
    if (vrm.lookAt) vrm.lookAt.target = lookTarget;
    zibaiRoot.add(vrm.scene);
    placeholder.visible = false;
    actor.attach(vrm);
    onProgress?.({phase:'ready', loaded:1, total:1, ratio:1});
    console.info('[Zibai] VRM ready:', src);
    return true;
  }catch(e){
    console.warn('[Zibai] VRM 載入失敗，用替身', e);
    placeholder.visible = true;
    onProgress?.({phase:'error', error:e});
    return false;
  }
}

function buildSlate(d, k){
  const g = new THREE.Group(); g.scale.setScalar(1.3); placeSlate(g, k);
  for (const s of [1, -1]){
    const tape = new THREE.Mesh(new THREE.BoxGeometry(.52, .004, .05), tapeMat);
    tape.rotation.y = s * Math.PI / 4; tape.position.y = .002; g.add(tape);
  }
  const tally = TALLY_HEX[d.status];
  const puddle = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.3),
    new THREE.MeshBasicMaterial({map:GLOW, color:tally, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending}));
  puddle.rotation.x = -Math.PI/2; puddle.position.y = .01; g.add(puddle);

  const lean = new THREE.Group(); lean.rotation.x = -.16; g.add(lean);
  const face = slateTexture(d);
  const faceMat = new THREE.MeshStandardMaterial({map:face, emissive:0xffffff, emissiveMap:face, emissiveIntensity:.22, roughness:.7});
  const body = new THREE.Mesh(new THREE.BoxGeometry(.62, .46, .028), [slateBody, slateBody, slateBody, slateBody, faceMat, slateBody]);
  body.position.y = .25; body.castShadow = true; lean.add(body);
  const lower = new THREE.Mesh(new THREE.BoxGeometry(.62, .055, .03), stickMat); lower.position.y = .51; lean.add(lower);
  const hinge = new THREE.Group(); hinge.position.set(-.31, .54, 0); lean.add(hinge);
  const upper = new THREE.Mesh(new THREE.BoxGeometry(.63, .055, .03), stickMat); upper.position.x = .315; hinge.add(upper);
  hinge.rotation.z = .32;
  const strut = new THREE.Mesh(new THREE.BoxGeometry(.03, .48, .02), slateBody);
  strut.position.set(0, .22, -.17); strut.rotation.x = .5; lean.add(strut);

  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(.01, .01, .22), slateBody); stalk.position.set(.24, .64, -.03); lean.add(stalk);
  const lampMat = new THREE.MeshStandardMaterial({color:0x111111, emissive:tally, emissiveIntensity:3});
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(.05, 16, 12), lampMat); lamp.position.set(.24, .77, -.03); lean.add(lamp);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW, color:new THREE.Color(tally).multiplyScalar(2.2), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
  glow.scale.setScalar(.5); glow.position.copy(lamp.position); lean.add(glow);

  const anchor = new THREE.Object3D(); anchor.position.set(0, .5, 0); lean.add(anchor);
  groups.question.add(g); tag(g, d); pickables.push(body, upper, lower);
  return {d, obj:g, k, body, faceMat, hinge, lean, lamp, lampMat, glow, puddle, anchor, drop:null};
}
function setTally(r){
  const c = TALLY_HEX[r.d.status];
  r.lampMat.emissive.setHex(c); r.glow.material.color.setHex(c).multiplyScalar(2.2); r.puddle.material.color.setHex(c);
}

function buildAll(){
  let mi = 0, li = 0, qi = 0;
  for (const d of DATA){
    let r;
    if (d.type === 'mood') r = buildDot(d, mi++);
    if (d.type === 'learn') r = buildNote(d, li++);
    if (d.type === 'question') r = buildSlate(d, qi++);
    objOf.set(d.id, r);
  }
  recomputeMoodLight(); updateCounts();
}
function refreshText(d){
  const r = objOf.get(d.id); if (!r) return;
  if (d.type === 'learn'){ r.obj.material.map.dispose(); const t = noteTexture(d); r.obj.material.map = t; r.obj.material.emissiveMap = t; r.obj.material.needsUpdate = true; }
  if (d.type === 'question'){ r.faceMat.map.dispose(); const t = slateTexture(d); r.faceMat.map = t; r.faceMat.emissiveMap = t; r.faceMat.needsUpdate = true; }

const labelLayer = $('#labels');
const labelEls = new Map();
function labelFor(d){
  let el = labelEls.get(d.id);
  if (!el){
    el = document.createElement('div'); el.className = 'lb'; el.style.opacity = 0;
    el.addEventListener('click', () => select(d.id));
    labelLayer.appendChild(el); labelEls.set(d.id, el);
  }
  const text = canSeeText(d) ? d.text : '只給老師看';
  const lead = d.type === 'mood' ? `<i style="--c:${canSeeMoodColor(d) ? MOODS[d.mood].hex : '#e8ecea'}"></i>` : '';
  const tail = d.type === 'question' ? `・${STATUS[d.status]}` : d.type === 'mood' && canSeeMoodColor(d) ? `・${MOODS[d.mood].name}` : '';
  el.innerHTML = `<b>${lead}${who(d)}${tail}</b>${text.length > 22 ? text.slice(0, 21) + '…' : text}`;
  return el;
}
const LABEL_NEAR = {mood:4.2, learn:0, question:0};    // 便利貼和場記板的字就寫在物件上
const tmpV = new THREE.Vector3();
function updateLabels(){
  const cand = [];
  for (const [id, r] of objOf){
    const near = LABEL_NEAR[r.d.type];
    if (!near || !state.filters[r.d.type] || r.arrive < 1){ hideLabel(id); continue; }
    r.anchor.getWorldPosition(tmpV);
    const dist = tmpV.distanceTo(camera.position);
    if (dist > near){ hideLabel(id); continue; }
    cand.push({r, dist, p:tmpV.clone()});
  }
  cand.sort((a, b) => a.dist - b.dist);
  cand.forEach((c, i) => {
    if (i > 6){ hideLabel(c.r.d.id); return; }
    const p = c.p.project(camera);
    if (p.z > 1){ hideLabel(c.r.d.id); return; }
    const el = labelEls.get(c.r.d.id) || labelFor(c.r.d);
    const x = (p.x * .5 + .5) * innerWidth, y = (-p.y * .5 + .5) * innerHeight;
    const k = THREE.MathUtils.clamp((c.dist - 1) / (LABEL_NEAR[c.r.d.type] - 1), 0, 1);
    el.style.transform = `translate(${x + 10}px, ${y - 12}px) translate(0,-100%) scale(${1.05 - k * .25})`;
    el.style.opacity = Math.min(1, (1 - k) * 2.2);
  });
}
function hideLabel(id){ const el = labelEls.get(id); if (el) el.style.opacity = 0; }

function select(id){
  const d = DATA.find(x => x.id === id); if (!d) return;
  highlight(false); state.selected = id; ring.visible = d.type === 'mood'; highlight(true);
  ring.scale.setScalar(d.type === 'mood' ? .5 : d.type === 'learn' ? .95 : 1.05);
  renderPanel(d);
  $('#panel').classList.add('open'); $('#panel').setAttribute('aria-hidden', 'false');
  const r = objOf.get(id); r.anchor.getWorldPosition(tmpV);
  if (tmpV.distanceTo(camera.position) > 3.2){
    const dir = camera.position.clone().sub(tmpV).setY(0).normalize();
    if (d.type === 'learn') dir.set(Math.sin(wall.rotation.y), 0, Math.cos(wall.rotation.y));
    if (d.type === 'question') r.obj.getWorldDirection(dir).setY(0).normalize();
    const narrow = innerWidth > 640 ? .55 : 0;
    const pos = tmpV.clone().add(dir.multiplyScalar(d.type === 'mood' ? 1.8 : d.type === 'question' ? 2.3 : 2.1)).setY(Math.max(1.3, tmpV.y + (d.type === 'question' ? .6 : .35)));
    const look = tmpV.clone().add(new THREE.Vector3(0, innerWidth <= 640 ? -.95 : 0, 0));
    fly(pos, look, 1.1, narrow);

}
function closePanel(){

const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    <div class="body">${visible ? esc(d.text) : '這則內容只給老師看。'}</div></div>`;

    const name = {zibai:'茲白', teacher:'阿祥老師', student:who(d), me:ME.nick}[m.who];
    const av = {zibai:'<span class="av z">茲</span>', teacher:'<span class="av t">師</span>'}[m.who] || `<span class="av">${esc(name).slice(0, 1)}</span>`;
    html += `<div class="msg ${m.who}"><div class="meta">${av}${esc(name)} · ${m.t}</div><div class="body">${esc(m.text)}</div></div>`;
  }
  if (visible && !d.thread.length && d.type !== 'question') html += `<p class="hint">還沒有人回應，留一句給 ${esc(who(d))} 吧。</p>`;
  $('#thread').innerHTML = html;

  const foot = $('#panelFoot'); foot.innerHTML = '';

    foot.innerHTML = `<div class="row"><textarea id="tReply" placeholder="以老師身分回覆…"></textarea><button class="btn amber" id="tSend">回覆並請茲白通知</button></div>
      <p class="hint">送出後茲白會用 LINE 通知 ${esc(who(d))}，Tally 轉黃。</p>`;
    $('#tSend').onclick = () => {
      const v = $('#tReply').value.trim(); if (!v) return;
      d.thread.push({who:'teacher', text:v, t:now()}, {who:'system', text:`茲白已用 LINE 通知 ${who(d)}`, t:now()});
      d.status = 'yellow'; onStatusChange(d); renderPanel(d); toast('已回覆，茲白會通知對方');
      actor.trigger('teacherReply', ctxOf(d));
    };
    return;
  }
  foot.innerHTML = `<div class="row"><textarea id="reply" placeholder="回一句…"></textarea><button class="btn" id="send">送出</button></div>`;
  $('#send').onclick = () => {
    const v = $('#reply').value.trim(); if (!v) return;
    d.thread.push({who:state.role === 'teacher' ? 'teacher' : 'me', text:v, t:now()}); renderPanel(d);
  };
  if (d.type === 'question' && d.mine && d.status !== 'green'){

    b.onclick = () => { d.status = 'green'; d.thread.push({who:'system', text:'發問者標記為已解決', t:now()}); onStatusChange(d); renderPanel(d); toast('場記板轉綠燈'); actor.trigger('solved', ctxOf(d)); };

/* 點擊判定：拖曳視角不算點擊 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; });
canvas.addEventListener('pointerup', e => {
  if (!down || !state.entered) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 7 || dt > 600) return;
  const id = pickAt(e.clientX, e.clientY);
  if (id === '__zibai') actor.trigger('tapZibai', {});
  else if (id) select(id); else if (state.selected) closePanel();
});
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons) canvas.style.cursor = pickAt(e.clientX, e.clientY) ? 'pointer' : 'grab'; });
function pickAt(x, y){
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables.filter(p => visibleChain(p)), false);
  return hits.length ? hits[0].object.userData.itemId : null;
}
function visibleChain(o){ for (let p = o; p; p = p.parent) if (p.visible === false) return false; return true; }

const SHOTS = {
  wide:{},
  zibai:{cap:'茲白身上的光，是大家留下的心情。一顆光點，一個人。'},
  wall:{cap:'今天學到的事，貼在 Multiview 上給下一個人看。'},
  slates:{cap:'問題立成場記板。紅燈等老師，黃燈已回覆，綠燈解決了。'},
};
// 鏡位都跟著互動配置算，換場景、搬學習牆都不用改程式
function shotPose(name){
  const L = currentLayout(), V = THREE.Vector3, dir = (ry) => new V(Math.sin(ry), 0, Math.cos(ry));
  if (name === 'wide'){ const look = new V(STAGE.x - .2, 1.3, STAGE.z + .5); return {look, pos:new V(STAGE.x + 1.3, 2.3, STAGE.z + 10.2).clamp(clampBox.min, clampBox.max)}; }
  if (name === 'zibai'){
    const zp = zibaiRoot.position, y = zibaiRoot.rotation.y, look = new V(zp.x, 1.25, zp.z);
    return {look, pos:look.clone().add(new V(Math.sin(y) * 2.6 + Math.cos(y) * .7, .3, Math.cos(y) * 2.6 - Math.sin(y) * .7))};
  }
  if (name === 'wall'){ const c = new V(L.wall.x, WALL.cy - .1, L.wall.z); return {look:c, pos:c.clone().addScaledVector(dir(L.wall.ry), 3.9).setY(1.8)}; }
  const c = new V(L.slates.x, .35, L.slates.z);
  return {look:c, pos:c.clone().addScaledVector(dir(L.slates.ry), 4.1).setY(1.75)};
}

let tween = null;
function fly(pos, look, dur = 1.6, sideShift = 0){
  const p1 = new THREE.Vector3(...(pos.isVector3 ? pos.toArray() : pos)), l1 = new THREE.Vector3(...(look.isVector3 ? look.toArray() : look));
  if (sideShift){ const right = new THREE.Vector3().subVectors(l1, p1).cross(camera.up).normalize(); l1.addScaledVector(right, sideShift); }
  tween = {p0:camera.position.clone(), l0:controls.target.clone(), p1, l1, t:0, dur};
  controls.enabled = false;
}
function stepTween(dt){
  if (!tween) return;
  tween.t = Math.min(1, tween.t + dt / tween.dur);
  const k = tween.t < .5 ? 4 * tween.t ** 3 : 1 - (-2 * tween.t + 2) ** 3 / 2;
  camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.l0, tween.l1, k);
  if (tween.t >= 1){ tween = null; controls.enabled = state.entered; }
}
let capTimer = 0;
function goShot(name){
  const s = SHOTS[name]; let {pos, look} = shotPose(name);
  if (camera.aspect < 1 && name !== 'wide') pos = look.clone().add(pos.sub(look).multiplyScalar({zibai:1.35, wall:1.9, slates:1.4}[name]));
  fly(pos, look, 1.6);
  document.querySelectorAll('#shots button').forEach(b => b.setAttribute('aria-current', b.dataset.shot === name));
  const cap = $('#caption'); clearTimeout(capTimer);
  if (s.cap){ cap.textContent = s.cap; cap.classList.add('on'); capTimer = setTimeout(() => cap.classList.remove('on'), 4200); }
  else cap.classList.remove('on');
}
document.querySelectorAll('#shots button').forEach(b => b.onclick = () => { closePanel(); goShot(b.dataset.shot); });

function spawn(d){
  const idx = DATA.filter(x => x.type === d.type).length - 1;
  const camFront = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1.2));
  if (d.type === 'mood'){
    goShot('zibai');
    const r = buildDot(d, idx); r.from.copy(camFront); r.obj.position.copy(camFront); r.arrive = 0; r.delay = -1.5; r.born = true;
    objOf.set(d.id, r); recomputeMoodLight(); toast('光點已放出，茲白亮了一點');
    actor.trigger('newMood', ctxOf(d));
  }
  if (d.type === 'learn'){
    goShot('wall');
    const r = buildNote(d, idx); objOf.set(d.id, r);
    r.fly = {t:0, from:wall.worldToLocal(camFront.clone())}; r.obj.position.copy(r.fly.from);
    toast('已貼上學習牆');
    actor.trigger('newLearn', ctxOf(d));
  }
  if (d.type === 'question'){
    goShot('slates');
    const r = buildSlate(d, idx); objOf.set(d.id, r);
    r.drop = {t:-1.2}; r.obj.position.y = 3;
    toast('場記板立起來了，茲白正在看');
    setTimeout(() => zibaiAnswers(d), 3600);
    actor.trigger('newQuestion', ctxOf(d));
  }
  updateCounts();
}
// 原型用：含這些關鍵字的問題假裝茲白答得出來，其他轉給老師
function zibaiAnswers(d){
  const canAnswer = /Pocket|OBS|VRM|快捷|安裝|下載|匯入/i.test(d.text);
  if (canAnswer){
    d.status = 'yellow';
    d.thread.push({who:'zibai', text:'我先回答看看：（這裡會是茲白查過知識庫後的回覆）。如果還是卡住，按「還是不懂」我就轉給老師。', t:now()});
  } else {
    d.thread.push({who:'zibai', text:'這題我不想亂講，已經請阿祥老師來看了！老師回覆後我會在 LINE 通知你。', t:now()});
  }
  const r = objOf.get(d.id); setTally(r); if (canAnswer) clap(r); updateCounts();
  if (state.selected === d.id) renderPanel(d);
  toast(canAnswer ? '茲白回覆了你的問題，Tally 轉黃' : '茲白把問題轉給老師了');
}
function clap(r){ r.clapT = 0; }

let toastTimer = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }

/* 拖 VRM 檔進來可以換角色 */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); const f = [...e.dataTransfer.files].find(f => /\.vrm$/i.test(f.name));
  if (f){ const url = URL.createObjectURL(f); loadVRM(url).then(() => { URL.revokeObjectURL(url); toast('已換上 ' + f.name); }); }
});

/* ───────── 茲白的行為 ───────── */
const UP = new THREE.Vector3(0, 1, 0);
let behavior = loadBehavior();
const ctxOf = (d) => ({item:d, obj:objOf.get(d.id)?.obj, nick:who(d), text:canSeeText(d) ? d.text : ''});
function wallFront(dist){
  const n = new THREE.Vector3(Math.sin(wall.rotation.y), 0, Math.cos(wall.rotation.y));
  return wall.position.clone().addScaledVector(n, dist).setY(0);
}
function resolvePoint(to, ctx){
  if (to === '__pt' && ctx.pt) return ctx.pt.clone();
  const wp = currentLayout().waypoints.find(w => w.id === to);
  if (wp) return new THREE.Vector3(wp.x, 0, wp.z);
  if (to === 'wall') return wallFront(1.35);
  if (to === 'event' && ctx.obj){
    if (ctx.item?.type === 'learn') return wallFront(1.35);
    if (ctx.item?.type === 'question'){
      const p = ctx.obj.getWorldPosition(new THREE.Vector3()), d = ctx.obj.getWorldDirection(new THREE.Vector3()).setY(0).normalize();
      return p.addScaledVector(d, 1.05).setY(0);
    }
  }
  return null;                                     // 光點會動，不走過去，只轉頭
}
function resolveLook(to, ctx){
  if (to === 'camera') return camera.position.clone();
  if (to === 'event' && ctx.obj) return ctx.obj.getWorldPosition(new THREE.Vector3());
  if (to === 'wall') return wall.position.clone().setY(WALL.cy);
  if (to === 'slates'){
    const c = new THREE.Vector3(); let n = 0;
    groups.question.children.forEach(g => { c.add(g.position); n++; });
    return n ? c.multiplyScalar(1 / n).setY(.6) : null;
  }
  const wp = currentLayout().waypoints.find(w => w.id === to);
  return wp ? new THREE.Vector3(wp.x, 1.3, wp.z) : null;
}
const bubble = $('#bubble'); let bubbleTimer = 0;
function say(text, sec){
  bubble.textContent = text; bubble.classList.add('on');
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubble.classList.remove('on'), sec * 1000);
}
const headPos = new THREE.Vector3();
function placeBubble(){
  if (!bubble.classList.contains('on')) return;
  const head = vrm?.humanoid.getNormalizedBoneNode('head');
  if (head) head.getWorldPosition(headPos); else headPos.copy(zibaiRoot.position).setY(1.5);
  headPos.y += .32;
  const p = headPos.project(camera);
  const hide = p.z > 1;
  bubble.style.visibility = hide ? 'hidden' : 'visible';
  bubble.style.transform = `translate(${(p.x * .5 + .5) * innerWidth + 14}px, ${(-p.y * .5 + .5) * innerHeight}px) translate(0,-100%)`;
}
const actor = createActor({root:zibaiRoot, camera, lookTarget, resolvePoint, resolveLook, onSay:say});
actor.setConfig({...behavior, waypoints:[]});
let characterUrl = null;
const characterOf = () => qs.get('vrm') || behavior.character || 'characters/Amy102800.vrm';

async function reloadMotions(){
  const map = new Map();
  try{
    const names = await motionsDB.list();
    const loader = new GLTFLoader(); loader.register(p => new VRMAnimationLoaderPlugin(p));
    for (const n of names){
      const buf = await motionsDB.get(n);
      try{ const g = await loader.parseAsync(buf, ''); const a = g.userData.vrmAnimations?.[0]; if (a) map.set(n, a); }
      catch(e){ console.warn('VRMA 解析失敗', n, e); }
    }
  }catch(e){ console.warn('讀不到動作庫', e); }
  actor.setMotions(map);
}

/* 導演台連線：設定即時同步、預演、回報茲白位置 */
const bus = 'BroadcastChannel' in window ? new BroadcastChannel(BUS_NAME) : null;
function sampleCtx(ev){
  const pick = (type, pred = () => true) => [...DATA].reverse().find(d => d.type === type && pred(d));
  const d = {newMood:pick('mood'), newLearn:pick('learn'), newQuestion:pick('question'),
             teacherReply:pick('question', x => x.status === 'yellow'), solved:pick('question', x => x.status === 'green')}[ev];
  return d ? ctxOf(d) : {};
}
if (bus){
  bus.onmessage = async ({data:m}) => {
    if (m.type === 'ping') bus.postMessage({type:'pong'});
    if (m.type === 'config') await adoptBehavior(m.config);
    if (m.type === 'topdown?') sendTopdown();
    if (m.type === 'shot' && state.entered){ closePanel(); goShot(m.shot); }
    if (m.type === 'walkTo') actor.run([{do:'walk', to:'__pt'}, {do:'face', to:'camera'}], {pt:new THREE.Vector3(m.x, 0, m.z)}, '導演台：走過去');
    if (m.type === 'run') actor.run(m.steps, sampleCtx(m.event));
    if (m.type === 'simulate') actor.run(behavior.reactions?.[m.event], sampleCtx(m.event), '模擬：' + m.event);
    if (m.type === 'motions'){ await reloadMotions(); }
  };
  setInterval(() => bus.postMessage({type:'status', sceneId, ...actor.status()}), 250);
}
addEventListener('storage', e => { if (e.key === STORE_KEY) adoptBehavior(loadBehavior()); });
// 劇本更新：場景換了就換場景層，角色換了就換角色，其他只重排互動物件
let adopting = Promise.resolve();
function adoptBehavior(next){
  adopting = adopting.then(async () => {
    next = migrate(next); if (!next) return;
    const sceneChanged = next.scene && next.scene !== sceneId;
    behavior = next;
    if (sceneChanged){ toast('換場景中…'); await loadSceneLayer(behavior.scene).catch(e => toast('場景載入失敗：' + e.message)); }
    else if (sceneId){ layoutFor(behavior, sceneId); applyLayout(false); }
    if (characterOf() !== characterUrl) await loadVRM(characterUrl = characterOf());
  });
  return adopting;
}
// 場景平面圖：只拍場景層（把互動物件、茲白先藏起來），給導演台當底圖
function sendTopdown(){
  if (!bus || !studio) return;
  const b = sceneBounds, w = b.maxX - b.minX, d = b.maxZ - b.minZ;
  const cam = new THREE.OrthographicCamera(-w / 2, w / 2, d / 2, -d / 2, .05, 120);
  cam.up.set(0, 0, -1);
  cam.position.set((b.minX + b.maxX) / 2, Math.max(1.5, b.maxY - 1.3), (b.minZ + b.maxZ) / 2);
  cam.lookAt(cam.position.x, 0, cam.position.z);
  const hide = [wall, ...Object.values(groups), zibaiRoot, markers, ring, floorHalo];
  const vis = hide.map(o => o.visible); hide.forEach(o => o.visible = false);
  const fog = scene.fog; scene.fog = null;
  renderer.render(scene, cam);
  const out = document.createElement('canvas'); out.width = 720; out.height = Math.round(720 * d / w);
  out.getContext('2d').drawImage(renderer.domElement, 0, 0, out.width, out.height);
  scene.fog = fog; hide.forEach((o, i) => o.visible = vis[i]);
  bus.postMessage({type:'topdown', sceneId, bounds:b, img:out.toDataURL('image/jpeg', .82)});
}

// 導演模式：地上標出站位
const markers = new THREE.Group(); scene.add(markers);
const markerMat = new THREE.MeshBasicMaterial({color:0xe9a23b, transparent:true, opacity:.8, depthWrite:false});
function updateMarkers(t){
  const wps = currentLayout().waypoints;
  while (markers.children.length < wps.length){
    const m = new THREE.Mesh(new THREE.RingGeometry(.22, .3, 32), markerMat); m.rotation.x = -Math.PI / 2; markers.add(m);
  }
  markers.children.forEach((m, i) => { const w = wps[i]; m.visible = !!w; if (w) m.position.set(w.x, .02, w.z); });
  markerMat.opacity = .5 + Math.sin(t * 3) * .25;
}

/* ───────── 主迴圈 ───────── */
const clock = new THREE.Clock();
const home = new THREE.Vector3();
function frame(){
  const dt = Math.min(clock.getDelta(), .05); const t = state.clock += dt;
  studio?.update(t);
  actor.update(dt, t);
  if (vrm) vrm.update(dt);

  // 光點：從四散處匯聚到茲白身邊
  for (const r of objOf.values()){
    if (r.d.type === 'mood'){
      if (state.entered) r.arrive = Math.min(1, Math.max(0, r.arrive + dt * .45 * (r.delay < 0 ? 1 : 0))), r.delay -= dt;
      dotHome(r, t, home);
      const k = r.arrive < 1 ? 1 - (1 - r.arrive) ** 3 : 1;
      r.obj.position.lerpVectors(r.from, home, k);
      if (r.arrive < 1) r.obj.position.y += Math.sin(k * Math.PI) * .8;
      const tw = .85 + Math.sin(t * 2.3 + r.orbit.ph) * .15;
      r.core.scale.setScalar(.11 * tw * (r.born && r.arrive < 1 ? 1.6 : 1));
    }
    if (r.d.type === 'learn' && r.fly){
      r.fly.t = Math.min(1, r.fly.t + dt / 1.1); const k = 1 - (1 - r.fly.t) ** 3;
      r.obj.position.lerpVectors(r.fly.from, r.slot.pos, k);
      r.obj.rotation.z = r.slot.rot + (1 - k) * 2.4; r.obj.scale.setScalar(.6 + .4 * k);
      if (r.fly.t >= 1) r.fly = null;
    }
    if (r.d.type === 'question'){
      if (r.drop){
        r.drop.t += dt; const u = THREE.MathUtils.clamp(r.drop.t / .7, 0, 1);
        const b = u < 1 ? 1 - Math.abs(Math.cos(u * Math.PI * 1.5)) * (1 - u) : 1;   // 落地彈兩下
        r.obj.position.y = 3 * (1 - (u * u)) * (u < .6 ? 1 : 0) + (u >= .6 ? (1 - b) * .15 : 0);
        if (u >= 1){ r.obj.position.y = 0; r.drop = null; clap(r); }
      }
      if (r.clapT !== undefined){
        r.clapT += dt;
        const c = r.clapT < .12 ? .32 + r.clapT / .12 * .35 : r.clapT < .2 ? .67 * (1 - (r.clapT - .12) / .08) : Math.min(.32, (r.clapT - .2) * 1.2);
        r.hinge.rotation.z = c; if (r.clapT > .5){ r.hinge.rotation.z = .32; delete r.clapT; }
      }
      const pulse = r.d.status === 'red' ? .55 + .45 * (Math.sin(t * 3.2) * .5 + .5) : r.d.status === 'yellow' ? .9 : .6;
      r.lampMat.emissiveIntensity = 3 * pulse; r.glow.material.opacity = pulse; r.puddle.material.opacity = .5 * pulse;
    }
  }

  // 茲白的光：心情越多越亮，顏色是大家心情的混色
  moodMix.lerp(moodMixTarget, dt * 1.5);
  moodPower += (moodPowerTarget * (state.entered ? 1 : .15) - moodPower) * dt * .8;
  { const yaw = zibaiRoot.rotation.y, zp = zibaiRoot.position;       // 茲白的光跟著她走
    moodKey.position.set(.5, 2.5, 2.1).applyAxisAngle(UP, yaw).add(zp); moodKey.target.position.set(zp.x, 1.1, zp.z);
    moodRim.position.set(-.4, 2.1, -.8).applyAxisAngle(UP, yaw).add(zp); floorHalo.position.set(zp.x, .03, zp.z); }
  moodKey.color.copy(moodMix); moodKey.intensity = 1.5 + 9 * moodPower;
  moodRim.color.copy(moodMix); moodRim.intensity = 1 + 5 * moodPower;
  floorHalo.material.color.copy(moodMix); floorHalo.material.opacity = .08 + .3 * moodPower;

  if (state.selected){
    const r = objOf.get(state.selected); r.anchor.getWorldPosition(ring.position);
    ring.material.rotation += dt * .6; ring.material.opacity = .45 + Math.sin(t * 4) * .2;
  }

  stepTween(dt);
  if (controls.enabled) controls.update();
  camera.position.clamp(clampBox.min, clampBox.max);
  camera.lookAt(controls.target);
  composer.render();
  updateLabels(); placeBubble();
  if (DIRECTOR) updateMarkers(t);
  requestAnimationFrame(frame);
}

/* ───────── 啟動 ───────── */
function setBootProgress(pct, text){
  const box = $('#loadProgress'), bar = $('#loadProgress i');
  if (text != null) $('#loadState').textContent = text;
  if (pct == null){ box.classList.remove('on'); bar.style.width = '0%'; return; }
  box.classList.add('on'); bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
}
function prettyBytes(n){
  if (!Number.isFinite(n) || n <= 0) return '';
  return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}
async function boot(){
  const allText = DATA.map(d => d.text + (d.nick || '')).join('') + '問題發問學習牆只給老師看匿名— Q0123456789/:';
  setBootProgress(8, '載入攝影棚與字型');
  await Promise.all([loadSceneLayer(qs.get('scene') || behavior.scene), fontsReady(allText)]);
  buildAll();
  moodMix.copy(moodMixTarget);
  camera.lookAt(controls.target);
  requestAnimationFrame(frame);

  // 場景完成就先開門，不再讓大型 VRM 阻塞整個進棚流程。
  $('#enter').disabled = false; $('#enter').textContent = '進棚';
  setBootProgress(38, '攝影棚完成，茲白正在背景就位…');
  if (DIRECTOR) $('#enter').click();

  // 動作庫與 VRM 都在背景載入；角色尚未完成時先顯示替身。
  reloadMotions().catch(e => console.warn('[Zibai] 動作庫載入失敗', e));
  characterUrl = characterOf();
  loadVRM(characterUrl, ({phase, loaded, total, ratio}) => {
    if (phase === 'download'){
      if (ratio != null){
        const pct = 40 + Math.round(ratio * 48);
        const size = total ? ` · ${prettyBytes(loaded)} / ${prettyBytes(total)}` : '';
        setBootProgress(pct, `正在下載茲白 ${Math.round(ratio * 100)}%${size}`);
      } else {
        setBootProgress(55, `正在下載茲白… ${prettyBytes(loaded)}`);
      }
    } else if (phase === 'parse'){
      setBootProgress(90, '下載完成，正在解析茲白…');
    } else if (phase === 'prepare'){
      setBootProgress(95, '正在建立角色骨架與材質…');
    } else if (phase === 'ready'){
      setBootProgress(100, '茲白就位 ✓');
      setTimeout(() => setBootProgress(null, ''), 1200);
    } else if (phase === 'error'){
      setBootProgress(null, `茲白暫時沒趕上，先用替身（可稍後重新載入 .vrm）`);
    }
  });
}
$('#enter').onclick = () => {
  $('#splash').classList.add('gone'); state.entered = true;
  goShot('wide'); tween.dur = 3.4;
  setTimeout(() => { if (!tween) controls.enabled = true; actor.trigger('enter', {}); }, 3500);
};
boot().catch(e => { console.error(e); $('#loadState').textContent = '載入失敗：' + e.message; });

window.__board = {DATA, select, goShot, state, camera, controls, actor, vrm:() => vrm, snap:() => { if (tween){ tween.t = .999; stepTween(.01); } }};   // 除錯用
</script>
</body>
